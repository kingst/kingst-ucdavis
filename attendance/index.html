<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Attendance</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      background: #e9ecef;
      color: #212529;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.4;
      -webkit-text-size-adjust: 100%;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
      max-width: 28rem;
      margin: 1.5rem auto;
      padding: 1.5rem;
    }
    @media (max-width: 32rem) {
      .card { margin: 1rem; }
    }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    .lead { margin: 0 0 .5rem; color: #495057; }
    label { display: block; font-weight: 600; margin: 1rem 0 .35rem; }
    input {
      box-sizing: border-box;
      width: 100%;
      font: inherit;
      font-size: 1rem; /* 16px keeps iOS from zooming the page on focus */
      padding: .6rem .75rem;
      border: 1px solid #ced4da;
      border-radius: 6px;
      background: #fff;
      color: inherit;
    }
    input:focus { outline: 2px solid #007bff; outline-offset: 1px; border-color: #007bff; }
    button {
      box-sizing: border-box;
      width: 100%;
      margin-top: 1.25rem;
      padding: .75rem;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      background: #007bff;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .error { color: #b02a37; margin: .75rem 0 0; }
    .success { color: #146c43; font-size: 1.15rem; font-weight: 600; margin: 0 0 .5rem; }
    .who { margin: 0 0 1rem; }
    a { color: #007bff; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Attendance</h1>
    <p class="lead">Check in with your name and UC Davis email.</p>

    <form id="form" method="post" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name"
             autocapitalize="words" maxlength="200" required>

      <label for="email">UC Davis email</label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email"
             autocapitalize="none" autocorrect="off" spellcheck="false"
             placeholder="you@ucdavis.edu" maxlength="200" required>

      <button id="submit" type="submit">Check in</button>
      <p id="error" class="error" role="alert" hidden></p>
    </form>

    <div id="done" hidden>
      <p class="success">You're checked in.</p>
      <p id="who" class="who"></p>
      <p><a href="#" id="again">Not right? Edit and resubmit</a></p>
    </div>
  </main>

  <script>
    (function () {
      var KEY_NAME = 'attendance.name';
      var KEY_EMAIL = 'attendance.email';

      var form = document.getElementById('form');
      var nameInput = document.getElementById('name');
      var emailInput = document.getElementById('email');
      var button = document.getElementById('submit');
      var error = document.getElementById('error');
      var done = document.getElementById('done');
      var who = document.getElementById('who');
      var again = document.getElementById('again');

      // localStorage can be missing or throw (private mode, blocked storage);
      // the page has to work without it, it just won't remember anything.
      function load(key) {
        try { return localStorage.getItem(key) || ''; } catch (e) { return ''; }
      }
      function save(key, value) {
        try { localStorage.setItem(key, value); } catch (e) {}
      }

      function showError(message) {
        error.textContent = message;
        error.hidden = false;
      }
      function hideError() {
        error.hidden = true;
      }
      function setBusy(busy) {
        button.disabled = busy;
        button.textContent = busy ? 'Checking in…' : 'Check in';
      }

      nameInput.value = load(KEY_NAME);
      emailInput.value = load(KEY_EMAIL);

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var name = nameInput.value.trim();
        var email = emailInput.value.trim().toLowerCase();

        if (!name || !email) {
          showError('Please fill in both your name and your email.');
          return;
        }
        if (!/^[^@\s]+@ucdavis\.edu$/.test(email)) {
          showError('Please use your @ucdavis.edu email address.');
          return;
        }

        // Remember what they typed even if this attempt fails.
        save(KEY_NAME, name);
        save(KEY_EMAIL, email);
        hideError();
        setBusy(true);

        fetch(window.location.pathname, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ name: name, email: email }),
          credentials: 'same-origin'
        }).then(function (response) {
          // A non-JSON body (e.g. an App Engine error page) counts as a failure.
          return response.json().catch(function () { return { ok: false }; });
        }).then(function (result) {
          if (result.ok) {
            who.textContent = name + ' (' + email + ')';
            form.hidden = true;
            done.hidden = false;
          } else {
            showError(result.error || 'Could not record your attendance. Please try again.');
          }
        }).catch(function () {
          showError('Could not reach the server. Check your connection and try again.');
        }).finally(function () {
          setBusy(false);
        });
      });

      again.addEventListener('click', function (event) {
        event.preventDefault();
        done.hidden = true;
        form.hidden = false;
        nameInput.focus();
      });
    })();
  </script>
</body>
</html>
